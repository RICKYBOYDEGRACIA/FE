<!-- Mobile Top Bar (Visible only on mobile view) -->
<header class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 z-40 lg:hidden">
  <div class="flex items-center gap-2">
    <mat-icon class="text-indigo-600">health_and_safety</mat-icon>
    <span class="font-bold text-gray-800 tracking-tight">App Logo</span>
  </div>
  <button mat-icon-button (click)="sidebarService.toggleMobile()" aria-label="Toggle mobile menu">
    <mat-icon>menu</mat-icon>
  </button>
</header>

<!-- Mobile Backdrop Overlay -->
@if (sidebarService.isMobileOpen()) {
  <div 
    class="fixed inset-0 bg-black/40 z-40 lg:hidden backdrop-blur-sm transition-opacity" 
    (click)="closeMobileMenu()">
  </div>
}

<!-- Sidebar Container -->
<aside 
  class="fixed top-0 left-0 h-full bg-white border-r border-gray-200 z-50 flex flex-col transition-all duration-300 w-[260px]"
  [ngClass]="{
    'lg:w-[260px]': !sidebarService.isCollapsed(),
    'lg:w-[auto]': sidebarService.isCollapsed(),
    '-translate-x-full lg:translate-x-0': !sidebarService.isMobileOpen(),
    'translate-x-0': sidebarService.isMobileOpen()
  }"
>
  <!-- 1. Header Section: Logo & Toggle Button -->
  <div class="h-16 flex items-center justify-between px-3 border-b border-gray-100 overflow-hidden whitespace-nowrap">
    <!-- Logo always shown on mobile, and on desktop when expanded -->
    <div class="flex items-center gap-2" [ngClass]="{'lg:hidden': sidebarService.isCollapsed()}">
      <mat-icon class="text-indigo-600">health_and_safety</mat-icon>
      <span class="font-bold text-gray-800 tracking-tight text-sm">App Logo</span>
    </div>
    
    <!-- Desktop Collapse Toggle Button (Hidden completely on mobile via 'hidden lg:inline-flex') -->
     @if(!sidebarService.isMobileOpen()){
    <button mat-icon-button (click)="toggleSidebar()" class="hidden lg:inline-flex text-gray-600 hover:bg-gray-100 rounded-lg" [title]="sidebarService.isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <mat-icon>{{ sidebarService.isCollapsed() ? 'menu' : 'chevron_left' }}</mat-icon>
    </button>
    }
  </div>

  <!-- 2. Main Content Section: Routes using @for loop -->
  <div class="flex-1 overflow-y-auto py-4 px-2 space-y-1">
    @for (item of navItems; track item.routePath) {
      <a 
        [routerLink]="item.routePath" 
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 px-2.5 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors group relative overflow-hidden whitespace-nowrap"
      >
        <mat-icon class="flex-shrink-0">{{ item.icon }}</mat-icon>
        <!-- Text is ALWAYS visible on mobile, and responds to collapse state ONLY on desktop -->
        <span class="truncate text-sm" [ngClass]="{'lg:hidden': sidebarService.isCollapsed()}">{{ item.label }}</span>
      </a>
    }
  </div>

  <!-- 3. Footer Section: Future Ideas -->
  <div class="p-2 border-t border-gray-100 overflow-hidden whitespace-nowrap">
    <!-- Full Footer Box (Shown on mobile, and desktop when expanded) -->
    <div class="bg-indigo-50/60 p-2.5 rounded-lg border border-indigo-100" [ngClass]="{'lg:hidden': sidebarService.isCollapsed()}">
      <p class="text-xs font-medium text-indigo-900">Future Ideas</p>
      <p class="text-[11px] text-indigo-700 mt-0.5">Workspace notes & widgets.</p>
    </div>

    <!-- Mini Icon Footer (Shown ONLY on desktop when collapsed) -->
    <div class="hidden lg:flex justify-center py-2" [ngClass]="{'lg:flex': sidebarService.isCollapsed(), 'lg:hidden': !sidebarService.isCollapsed()}" title="Future Ideas">
      <mat-icon class="text-indigo-400 text-sm">lightbulb</mat-icon>
    </div>
  </div>
</aside>
